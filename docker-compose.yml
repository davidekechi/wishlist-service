version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: sail
        uid: 1000
    image: wishlist-service-app
    container_name: wishlist-service-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    networks:
      - wishlist-service-network
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: wishlist-service-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wishlist-service-network
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: wishlist-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wishlist-service-network

networks:
  wishlist-service-network:
    driver: bridge

# Add this at the bottom of the file
volumes:
  postgres_data:
    driver: local
  vendor:                                  # ← ADD THIS
    driver: local